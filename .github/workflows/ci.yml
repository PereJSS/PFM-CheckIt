name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 es la versión mínima instalable: psycopg[binary]==3.3.4 requiere
        # Python >= 3.10 (en 3.8/3.9 pip no lo encuentra). 3.13 cubre la versión
        # actual que usan por defecto plataformas como Render.
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: checkIt
    env:
      # Valores de prueba: el workflow no necesita ningún secreto.
      # Sin DB_HOST, settings.py usa SQLite. Los tests mockean Celery y la TSA,
      # así que no hacen falta Redis ni red.
      SECRET_KEY: ci-insecure-test-key
      DEBUG: "False"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: checkIt/requirements.txt

      - name: Instalar dependencias
        # Solo checkIt/requirements.txt: el requirements.txt de la raíz es un
        # volcado del host (Django 2.2, cloud-init, CUDA...) y no lo usa la app.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Comprobar migraciones pendientes
        run: python manage.py makemigrations --check --dry-run

      - name: Generar clave de firma efímera
        # La clave de firma del PDF no está en el repo: los tests firman con una de usar y tirar
        run: python generar_certs.py

      - name: Tests
        run: python manage.py test

      - name: Validar esquema OpenAPI
        run: python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yml

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        # El lockfile es compatible con npm 10 (Node 20) y npm 11; regenerarlo con
        # `npx npm@10.8.2 install` para no romper `npm ci` en el CI.
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Build
        run: npm run build
