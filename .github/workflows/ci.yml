name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 es la versión mínima instalable: psycopg[binary]==3.3.4 requiere
        # Python >= 3.10 (en 3.8/3.9 pip no lo encuentra). 3.13 cubre la versión
        # actual que usan por defecto plataformas como Render.
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: checkIt
    env:
      # Valores de prueba: el workflow no necesita ningún secreto.
      # Sin DB_HOST, settings.py usa SQLite. Los tests mockean Celery y la TSA,
      # así que no hacen falta Redis ni red.
      SECRET_KEY: ci-insecure-test-key
      DEBUG: "False"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: checkIt/requirements.txt

      - name: Instalar dependencias
        # Solo checkIt/requirements.txt: el requirements.txt de la raíz es un
        # volcado del host (Django 2.2, cloud-init, CUDA...) y no lo usa la app.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Comprobar migraciones pendientes
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: python manage.py test

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        # package-lock.json está desincronizado (entradas @emnapi/*) y `npm ci`
        # falla. Mientras no se regenere el lockfile, se recurre a `npm install`
        # y se deja un aviso visible en el resumen del run.
        run: |
          if ! npm ci; then
            echo "::warning file=frontend/package-lock.json::npm ci ha fallado: package-lock.json no está sincronizado con package.json. Ejecuta 'npm install' en frontend/ y haz commit del lockfile."
            npm install --no-audit --no-fund
          fi

      - name: Lint
        # Hay errores de ESLint preexistentes (react-hooks/set-state-in-effect,
        # no-unused-vars). No deben bloquear el CI hasta que se corrijan; quitar
        # continue-on-error cuando `npm run lint` pase limpio.
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build
